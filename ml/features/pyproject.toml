[project]
name = "alphalens-features"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = ["alphalens-data"]

[project.scripts]
alphalens-features = "alphalens_features.cli:main"

[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/alphalens_features"]
