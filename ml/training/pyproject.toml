[project]
name = "alphalens-training"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = ["alphalens-labels", "scikit-learn>=1.7,<1.8", "skops>=0.14,<0.15", "threadpoolctl>=3.6,<4"]

[project.scripts]
alphalens-train = "alphalens_training.cli:train_main"
alphalens-model = "alphalens_training.cli:model_main"

[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/alphalens_training"]
