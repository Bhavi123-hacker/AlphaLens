[project]
name = "alphalens-evaluation"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = ["alphalens-training", "lightgbm==4.6.0", "catboost==1.2.8", "xgboost-cpu==3.0.5"]

[project.scripts]
alphalens-evaluate = "alphalens_evaluation.cli:main"

[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/alphalens_evaluation"]
