[project]
name = "alphalens-data"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = ["pydantic>=2.13,<3", "pyarrow>=25.0.1,<26", "psycopg[binary]>=3.2,<4", "pytz==2026.5"]

[project.scripts]
alphalens-provider-status = "alphalens_data.sample_ingestion:main"
alphalens-ingest = "alphalens_data.ingestion.cli:main"
alphalens-validate = "alphalens_data.quality.cli:main"
alphalens-universe = "alphalens_data.universe.cli:main"
alphalens-canonical-build = "alphalens_data.canonical.cli:main"

[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/alphalens_data"]
