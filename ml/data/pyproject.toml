[project]
name = "alphalens-data"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = ["pydantic>=2.13,<3"]

[project.scripts]
alphalens-provider-status = "alphalens_data.sample_ingestion:main"

[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/alphalens_data"]
