[project]
name = "alphalens-backtesting"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = ["alphalens-evaluation"]

[project.scripts]
alphalens-backtest = "alphalens_backtesting.cli:main"

[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/alphalens_backtesting"]
