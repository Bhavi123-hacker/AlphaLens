[project]
name = "alphalens-decision"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = ["alphalens-evaluation"]

[project.scripts]
alphalens-risk = "alphalens_decision.risk_cli:main"

[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/alphalens_decision"]
