[project]
name = "alphalens-api"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.141,<0.142",
  "pydantic>=2.13,<3",
  "pydantic-settings>=2.15,<3",
  "uvicorn>=0.38,<1",
  "psycopg[binary]>=3.2,<4",
]

[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/alphalens_api"]
