name: foundation
on: [push, pull_request]
permissions:
  contents: read
jobs:
  quality:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-bookworm
        env:
          POSTGRES_USER: test_only
          POSTGRES_DB: test_only
          POSTGRES_PASSWORD: test_only_ci_ephemeral
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U test_only -d test_only"
          --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      ALPHALENS_TEST_DATABASE_URL: postgresql://test_only:test_only_ci_ephemeral@localhost:5432/test_only
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.12'
          version: '0.11.25'
      - name: Require a real generated lockfile
        run: test -f uv.lock && uv lock --check
      - run: uv sync --frozen
      - run: uv run --frozen ruff check .
      - run: uv run --frozen ruff format --check .
      - run: uv run --frozen mypy
      - run: uv run --frozen pytest -W error -ra
      - run: uv run --frozen bandit -r apps/api/src ml/data/src ml/features/src ml/labels/src ml/training/src ml/evaluation/src backtesting/src decision/src portfolio/src
      - run: uv run --frozen pip-audit --skip-editable
      - name: Secret scan (Git history)
        uses: trufflesecurity/trufflehog@v3.93.8
        with:
          path: ./
          version: '3.93.8'
          extra_args: --results=verified,unknown
      - run: docker build -f infra/docker/api.Dockerfile -t alphalens-foundation:ci .
      - name: Verify runtime imports and build-tool boundary
        run: |
          docker run --rm --network none alphalens-foundation:ci /app/.venv/bin/python -c '
          import importlib, os
          from pathlib import Path
          modules = (
              "alphalens_api", "alphalens_data", "alphalens_features", "alphalens_labels",
              "alphalens_training", "alphalens_evaluation", "alphalens_backtesting",
              "alphalens_decision", "alphalens_portfolio", "sklearn", "lightgbm",
              "catboost", "xgboost",
          )
          for module in modules:
              importlib.import_module(module)
          assert os.getuid() != 0
          assert not Path("/usr/local/bin/uv").exists()
          print("Native/runtime imports passed; non-root; build-only uv absent")
          '
      - name: Container scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: alphalens-foundation:ci
          exit-code: '1'
          severity: HIGH,CRITICAL
          timeout: 10m
          format: json
          output: trivy-results.json
      - name: Preserve container vulnerability evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-results
          path: trivy-results.json
          if-no-files-found: ignore
