name: research-dashboard
on: [push, pull_request]
permissions:
  contents: read
jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: '22.23.3'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci --no-fund
      - run: npm run api:generate
      - name: Verify the frozen OpenAPI client
        run: git diff --exit-code -- src/api/generated.ts
      - run: node scripts/generate-notices.mjs
      - name: Verify retained runtime licenses
        run: git diff --exit-code -- public/third-party-notices.txt
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npm audit
      # Real browser integration requires the local-only frozen research archive.
      # It is verified locally and never replaced here with fabricated market data.
      # The separate foundation workflow retains its strict Trivy security gate.
