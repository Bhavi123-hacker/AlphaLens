[project]
name = "alphalens-portfolio"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = ["alphalens-decision"]

[project.scripts]
alphalens-portfolio = "alphalens_portfolio.cli:main"
alphalens-paper = "alphalens_portfolio.paper_cli:main"

[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/alphalens_portfolio"]
